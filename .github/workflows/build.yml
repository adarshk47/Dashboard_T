name: Build & Release APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/MessageOrganizer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessageOrganizer-debug
          path: app/build/outputs/apk/debug/MessageOrganizer.apk
          retention-days: 30

      - name: Delete old latest release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || contains(github.ref, 'claude/')
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || contains(github.ref, 'claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Message Organizer — Latest Build"
          body: |
            ## Message Organizer APK

            **Direct download link below** — tap the APK file on your Android phone to install.

            ### Install instructions
            1. Tap **MessageOrganizer.apk** below to download
            2. Open the downloaded file and tap Install
            3. If blocked: Settings → Install unknown apps → allow your browser
            4. After install: Settings → Privacy → Permission Manager → SMS → Message Organizer → Allow

            Built automatically from latest code.
          files: app/build/outputs/apk/debug/MessageOrganizer.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
